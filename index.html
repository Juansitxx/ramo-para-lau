<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Un ramo de flores ASCII que florece para Lau.">
  <title>Lau</title>
  <link rel="stylesheet" href="style.css?v=apodos-4">
</head>
<body>
  <main class="page">
    <header class="heading">
      <h1><em>Lau</em><span class="cursor" aria-hidden="true">_</span></h1>
      <p class="apodos">Gordita, hermosa, bebé, kfircita, riquita, algodoncito, flaquita, hermosita, olorocita a rico</p>
    </header>

    <section class="stage" aria-label="Ramo de flores ASCII interactivo">
      <canvas id="bouquet" aria-label="Ramo ASCII animado con flores de varios colores" role="img"></canvas>
      <div class="overlay" id="overlay">
        <button class="primary" id="open" type="button">Abrir</button>
      </div>
    </section>

    <div class="controls" id="controls" hidden>
      <div class="actions">
        <button id="petals" type="button">Lluvia de pétalos</button>
        <button id="again" type="button">Verlo florecer otra vez</button>
      </div>
    </div>
  </main>
  <script src="ramo.js?v=flores-movil-3"></script>
</body>
</html>
